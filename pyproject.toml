[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "time-archiver"
version = "1.0.0"
description = "时档匠：纯本地离线的时序数据分层降质归档工具"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "时档匠项目组"}]
dependencies = [
    "PyYAML>=6.0,<7",
    "pandas>=2.1,<3",
    "pyarrow>=14,<20",
    "click>=8.1,<9",
    "Flask>=3.0,<4",
    "python-dateutil>=2.8,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9", "pytest-cov>=5.0,<7"]

[project.scripts]
time-archiver = "time_archiver.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"time_archiver.web" = ["templates/*.html", "static/*.css", "static/*.js"]
