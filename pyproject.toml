[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "time-archiver"
version = "1.1.0"
description = "时档匠：纯本地离线的时序数据分层降质归档工具"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "时档匠项目组"}]
# 版本与 requirements.txt、wheelhouse/ 内轮子文件名、
# wheelhouse/constraints.txt 严格一致，四处同步维护。
dependencies = [
    "PyYAML==6.0.3",
    "pandas==2.3.3",
    "pyarrow==19.0.1",
    "numpy==2.4.6",
    "click==8.5.1",
    "Flask==3.1.3",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-cov==6.3.0"]

[project.scripts]
time-archiver = "time_archiver.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"time_archiver.web" = ["templates/*.html", "static/*.css", "static/*.js"]
