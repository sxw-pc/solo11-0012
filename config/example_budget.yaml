# 时档匠准入与资源预算示例（可选）
# 将此文件复制为工作目录中的 budget.yaml 即可启用准入控制；
# 文件不存在时行为与未启用预算完全一致。
# 预算配置独立于 policy.yaml，不参与策略哈希与任务标识，
# 因此调整预算不会让既有任务缓存失效。
version: 1

# 准入总预算（字节）：同一调度窗口内“已准入但尚未释放”的预估峰值内存上限。
# 预估超过该值的单个数据源会被直接拒绝并写入审计；
# 其余源按预估成本升序准入，排队源随预算释放逐步推进。
max_inflight_bytes: 268435456  # 256 MiB

# 预估安全系数：逐层桶数递推结果统一乘以该系数，1.0 表示不加余量。
safety_factor: 1.5

# 是否把同源同层活跃分片的实际行数作为预估下界参照（只读查询，不重算已完成源）。
history_reference: true
